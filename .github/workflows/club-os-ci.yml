name: club-os CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "packages/**"
      - ".github/workflows/club-os-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "packages/**"
      - ".github/workflows/club-os-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: postgresql://club:club@localhost:5432/club?schema=public
      AUTH_SECRET: ci-secret-32-bytes-of-pad-pad-pad
      EMAIL_SERVER: smtp://localhost:1025
      EMAIL_FROM: noreply@club.local
      CLUB_NAME: Club OS CI
      CLUB_LOCALE: en-US
      CLUB_CURRENCY: USD
      CLUB_TIMEZONE: America/New_York
      CLUB_PUBLIC_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: club
          POSTGRES_PASSWORD: club
          POSTGRES_DB: club
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://club:club@localhost:5432/club?schema=public
      AUTH_SECRET: ci-secret-32-bytes-of-pad-pad-pad
      EMAIL_SERVER: smtp://localhost:1025
      EMAIL_FROM: noreply@club.local
      CLUB_NAME: Club OS CI
      CLUB_LOCALE: en-US
      CLUB_CURRENCY: USD
      CLUB_TIMEZONE: America/New_York
      CLUB_PUBLIC_URL: http://localhost:3000
      # Stripe + Twilio creds aren't required for the e2e suite (it
      # covers smoke + auth + API contract). Wire real test keys when
      # the payment/SMS golden paths are added.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply migrations and seed
        run: |
          pnpm db:generate
          pnpm db:migrate deploy || pnpm db:migrate
          pnpm db:seed

      - name: Run Playwright suite
        run: pnpm e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 14
